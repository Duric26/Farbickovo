name: Build Farbičkovo
on:
  push: {branches: [main]}
  workflow_dispatch:
permissions: {contents: write, pages: write, id-token: write}
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#ffd33d' --splashBackgroundColor '#8fd8ff'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Farbickovo.apk
      - uses: actions/upload-artifact@v4
        with: {name: Farbickovo-apk, path: Farbickovo.apk}
      - uses: softprops/action-gh-release@v2
        with: {tag_name: "v1.0.${{ github.run_number }}", name: "Farbičkovo ${{ github.run_number }}", files: Farbickovo.apk}
  pages:
    runs-on: ubuntu-latest
    environment: {name: github-pages}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: www}
      - uses: actions/deploy-pages@v4
